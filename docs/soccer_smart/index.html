<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Soccer Smart Lab - Your Tactical Decisions</title>
  <style>
    :root {
      color-scheme: dark;
      --navy: rgb(14, 29, 40);
      --panel: rgb(24, 44, 57);
      --ink: rgb(231, 241, 244);
      --muted: rgb(157, 181, 190);
      --green: rgb(159, 235, 164);
      --gold: rgb(255, 207, 107);
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--navy);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .topbar {
      width: 100%;
      max-width: 1280px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .topbar a {
      color: var(--green);
      text-decoration: none;
      font-weight: 600;
    }
    .topbar a:hover {
      text-decoration: underline;
    }
    .stage-wrap {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px 8px 8px;
      min-height: 0;
    }
    canvas#game-canvas {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      aspect-ratio: 1280 / 880;
      border-radius: 12px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
      touch-action: manipulation;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="../index.html">&lt;- All Games</a>
    <span id="status-hint">Keys: 1-7, SPACE (skip), C (coach), R (retry), N (next), B (book), ESC (menu) | Touch: tap choice to preview, tap again to confirm</span>
  </header>
  <div class="stage-wrap">
    <canvas id="game-canvas" width="1280" height="880" aria-label="Soccer Smart Lab tactical pitch and controls"></canvas>
  </div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
