name: Adventure Worlds checks
on:
  pull_request:
    paths:
      - 'adventure_worlds/**'
      - 'docs/adventure_worlds/**'
      - 'docs/index.html'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/adventure-worlds.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck:adventure_worlds
      - run: npm run test:adventure_worlds
      - run: npm run build:adventure_worlds
      - run: npm run test:adventure_worlds
