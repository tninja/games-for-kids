name: Football IQ checks
on:
  pull_request:
    paths:
      - 'football_iq/**'
      - 'docs/football_iq/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/football-iq.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck:football_iq
      - run: npm run test:football_iq
      - run: npm run build:football_iq
      - run: npm run test:football_iq
      - run: npm install --no-save --package-lock=false playwright@1.56.1 phaser@3.90.0
      - run: npx playwright install --with-deps chromium
      - run: node football_iq/browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-iq-mobile-screenshots
          path: football_iq/screenshots/
          if-no-files-found: ignore
